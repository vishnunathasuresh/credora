name: Copilot review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  request-review:
    name: Request GitHub Copilot review
    runs-on: ubuntu-latest
    steps:
      - name: Request Copilot review when not already requested
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" --jq '.users[].login' | grep -Fxq 'copilot-pull-request-reviewer[bot]'; then
            echo 'Copilot review is already requested.'
            exit 0
          fi
          gh api --method POST "repos/${REPOSITORY}/pulls/${PR_NUMBER}/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]'
