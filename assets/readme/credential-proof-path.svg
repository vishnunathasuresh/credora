<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
  <title id="title">Credora credential proof path</title>
  <desc id="desc">An issuer signs a credential transaction. The EVM registry anchors the proof while IPFS serves its public metadata. A holder shares a link or QR code, and a verifier checks the public record and metadata.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#718096" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="490" rx="26" fill="#f7f9fc"/>
  <text x="56" y="57" fill="#536174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" letter-spacing="2">A PUBLIC CREDENTIAL PROOF PATH</text>
  <text x="56" y="111" fill="#152238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="700" letter-spacing="-1.4">From issuer signature to public verification</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g>
      <rect x="50" y="150" width="250" height="214" rx="16" fill="#ffffff" stroke="#d7e0ec" stroke-width="2"/>
      <circle cx="80" cy="184" r="17" fill="#eaf0ff"/>
      <text x="80" y="190" text-anchor="middle" fill="#315ce8" font-size="17" font-weight="700">01</text>
      <text x="108" y="191" fill="#315ce8" font-size="18" font-weight="700" letter-spacing="1">ISSUE</text>
      <text x="72" y="239" fill="#152238" font-size="25" font-weight="700">Issuer wallet</text>
      <text x="72" y="276" fill="#42516a" font-size="21">Signs the issuance</text>
      <text x="72" y="306" fill="#42516a" font-size="21">transaction. The private</text>
      <text x="72" y="336" fill="#42516a" font-size="21">key stays in the wallet.</text>
    </g>

    <path d="M305 257h31" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="350" y="150" width="250" height="214" rx="16" fill="#ffffff" stroke="#d7e0ec" stroke-width="2"/>
      <circle cx="380" cy="184" r="17" fill="#e9f8f1"/>
      <text x="380" y="190" text-anchor="middle" fill="#0b875a" font-size="17" font-weight="700">02</text>
      <text x="408" y="191" fill="#0b875a" font-size="18" font-weight="700" letter-spacing="1">ANCHOR</text>
      <rect x="368" y="213" width="214" height="60" rx="10" fill="#eff5ff"/>
      <text x="384" y="239" fill="#152238" font-size="20" font-weight="700">EVM registry</text>
      <text x="384" y="261" fill="#42516a" font-size="18">Proof hash + issuer + URI</text>
      <rect x="368" y="287" width="214" height="60" rx="10" fill="#ecf9f3"/>
      <text x="384" y="313" fill="#152238" font-size="20" font-weight="700">IPFS</text>
      <text x="384" y="335" fill="#42516a" font-size="18">Public metadata bytes</text>
    </g>

    <path d="M605 257h31" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="650" y="150" width="250" height="214" rx="16" fill="#ffffff" stroke="#d7e0ec" stroke-width="2"/>
      <circle cx="680" cy="184" r="17" fill="#f1edff"/>
      <text x="680" y="190" text-anchor="middle" fill="#7250c8" font-size="17" font-weight="700">03</text>
      <text x="708" y="191" fill="#7250c8" font-size="18" font-weight="700" letter-spacing="1">CARRY</text>
      <text x="672" y="239" fill="#152238" font-size="25" font-weight="700">Holder</text>
      <text x="672" y="276" fill="#42516a" font-size="21">Keeps a credential</text>
      <text x="672" y="306" fill="#42516a" font-size="21">reference and shares a</text>
      <text x="672" y="336" fill="#42516a" font-size="21">link or selected-hash QR.</text>
    </g>

    <path d="M905 257h31" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>

    <g>
      <rect x="950" y="150" width="200" height="214" rx="16" fill="#ffffff" stroke="#b9e7d2" stroke-width="2"/>
      <circle cx="980" cy="184" r="17" fill="#e9f8f1"/>
      <text x="980" y="190" text-anchor="middle" fill="#0b875a" font-size="17" font-weight="700">04</text>
      <text x="1008" y="191" fill="#0b875a" font-size="18" font-weight="700" letter-spacing="1">CHECK</text>
      <text x="972" y="239" fill="#152238" font-size="25" font-weight="700">Verifier</text>
      <text x="972" y="276" fill="#42516a" font-size="21">Reads the record and</text>
      <text x="972" y="306" fill="#42516a" font-size="21">metadata, then checks</text>
      <text x="972" y="336" fill="#42516a" font-size="21">the credential hash.</text>
    </g>
  </g>

  <rect x="50" y="394" width="1100" height="54" rx="12" fill="#e9eef5"/>
  <text x="74" y="428" fill="#23334b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600">Registry anchors proof</text>
  <circle cx="310" cy="421" r="3" fill="#8290a3"/>
  <text x="332" y="428" fill="#23334b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600">IPFS serves metadata</text>
  <circle cx="563" cy="421" r="3" fill="#8290a3"/>
  <text x="585" y="428" fill="#23334b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600">API supports workflows and projections</text>
</svg>
