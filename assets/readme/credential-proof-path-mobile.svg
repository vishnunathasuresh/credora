<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1110" viewBox="0 0 480 1110" role="img" aria-labelledby="title desc">
  <title id="title">Credora credential proof path</title>
  <desc id="desc">An issuer signs a credential transaction. The EVM registry anchors the proof while IPFS serves its public metadata. A holder shares a link or QR code, and a verifier checks the public record and metadata.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#718096" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="480" height="1110" rx="24" fill="#f7f9fc"/>
  <text x="32" y="57" fill="#536174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" letter-spacing="1.6">A PUBLIC CREDENTIAL PROOF PATH</text>
  <text x="32" y="106" fill="#152238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="700" letter-spacing="-0.6">From signature to verification</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g>
      <rect x="32" y="145" width="416" height="170" rx="16" fill="#ffffff" stroke="#d7e0ec" stroke-width="2"/>
      <circle cx="66" cy="181" r="19" fill="#eaf0ff"/>
      <text x="66" y="188" text-anchor="middle" fill="#315ce8" font-size="18" font-weight="700">01</text>
      <text x="100" y="188" fill="#315ce8" font-size="19" font-weight="700" letter-spacing="1">ISSUE</text>
      <text x="56" y="232" fill="#152238" font-size="24" font-weight="700">Issuer wallet</text>
      <text x="56" y="269" fill="#42516a" font-size="21">Signs the transaction; the private key</text>
      <text x="56" y="297" fill="#42516a" font-size="21">stays in the wallet.</text>
    </g>
    <path d="M240 320v24" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="32" y="355" width="416" height="170" rx="16" fill="#ffffff" stroke="#b9e7d2" stroke-width="2"/>
      <circle cx="66" cy="391" r="19" fill="#e9f8f1"/>
      <text x="66" y="398" text-anchor="middle" fill="#0b875a" font-size="18" font-weight="700">02</text>
      <text x="100" y="398" fill="#0b875a" font-size="19" font-weight="700" letter-spacing="1">ANCHOR</text>
      <text x="56" y="442" fill="#152238" font-size="24" font-weight="700">Registry + IPFS</text>
      <text x="56" y="479" fill="#42516a" font-size="21">Registry records proof; IPFS serves</text>
      <text x="56" y="507" fill="#42516a" font-size="21">public metadata bytes.</text>
    </g>
    <path d="M240 530v24" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="32" y="565" width="416" height="170" rx="16" fill="#ffffff" stroke="#d7e0ec" stroke-width="2"/>
      <circle cx="66" cy="601" r="19" fill="#f1edff"/>
      <text x="66" y="608" text-anchor="middle" fill="#7250c8" font-size="18" font-weight="700">03</text>
      <text x="100" y="608" fill="#7250c8" font-size="19" font-weight="700" letter-spacing="1">CARRY</text>
      <text x="56" y="652" fill="#152238" font-size="24" font-weight="700">Holder</text>
      <text x="56" y="689" fill="#42516a" font-size="21">Shares a credential link or a QR</text>
      <text x="56" y="717" fill="#42516a" font-size="21">with selected credential hashes.</text>
    </g>
    <path d="M240 740v24" fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"/>
    <g>
      <rect x="32" y="775" width="416" height="170" rx="16" fill="#ffffff" stroke="#b9e7d2" stroke-width="2"/>
      <circle cx="66" cy="811" r="19" fill="#e9f8f1"/>
      <text x="66" y="818" text-anchor="middle" fill="#0b875a" font-size="18" font-weight="700">04</text>
      <text x="100" y="818" fill="#0b875a" font-size="19" font-weight="700" letter-spacing="1">CHECK</text>
      <text x="56" y="862" fill="#152238" font-size="24" font-weight="700">Public verifier</text>
      <text x="56" y="899" fill="#42516a" font-size="21">Checks registry + metadata and the</text>
      <text x="56" y="927" fill="#42516a" font-size="21">credential hash. No login required.</text>
    </g>
  </g>

  <rect x="32" y="978" width="416" height="94" rx="12" fill="#e9eef5"/>
  <text x="56" y="1018" fill="#23334b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600">Registry = proof · IPFS = metadata</text>
  <text x="56" y="1048" fill="#23334b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="600">API = workflows and projections</text>
</svg>
